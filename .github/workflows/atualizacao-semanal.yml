name: Atualização semanal (Escolas Quilombolas em Dados)

on:
  schedule:
    - cron: "0 2 * * 1"   # toda segunda-feira, 02h00 UTC (domingo 23h em Brasília)
  workflow_dispatch:      # permite rodar manualmente na aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rodar atualização
        run: python atualizar_dados.py

      - name: Publicar mudanças (se houver)
        run: |
          if git diff --quiet; then
            echo "Nada mudou nesta semana."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Atualiza dados do painel — $(date +'%d/%m/%Y')"
            git push
          fi
